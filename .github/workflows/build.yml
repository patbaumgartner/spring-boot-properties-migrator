name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Also enforces spring-javaformat, which runs in the validate phase.
      - name: Build and test Maven modules
        run: ./mvnw -B -ntp install -pl spring-boot-properties-migrator-maven-plugin -am

      - name: Run Maven sample regression tests
        run: |
          REVISION=$(sed -n 's/^-Drevision=//p' .mvn/maven.config | head -n1)
          ./samples/spring-boot-3.5-maven-sample/mvnw -B -ntp \
            -f samples/spring-boot-3.5-maven-sample/pom.xml \
            -Dmigrator.version="${REVISION}" test

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build and test Gradle plugin
        run: |
          ./spring-boot-properties-migrator-gradle-plugin/gradlew \
            -p spring-boot-properties-migrator-gradle-plugin build --no-daemon

      - name: Run Gradle sample regression tests
        run: |
          ./samples/spring-boot-3.5-gradle-sample/gradlew \
            -p samples/spring-boot-3.5-gradle-sample test --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            **/target/surefire-reports/**
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7
