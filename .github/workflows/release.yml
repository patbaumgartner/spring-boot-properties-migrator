name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolve release version
        id: release-version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Prepare release version files
        run: |
          RELEASE_VERSION="${{ steps.release-version.outputs.version }}"
          sed -i -E "s#^-Drevision=.*#-Drevision=${RELEASE_VERSION}#" .mvn/maven.config
          perl -0pi -e 's#<revision>[^<]+</revision>#<revision>'"$RELEASE_VERSION"'</revision>#' pom.xml

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build and test Gradle plugin
        run: |
          ./spring-boot-properties-migrator-gradle-plugin/gradlew \
            -p spring-boot-properties-migrator-gradle-plugin \
            -PreleaseVersion=${{ steps.release-version.outputs.version }} \
            build --no-daemon

      # Never publish something the samples have not exercised end to end.
      - name: Verify Maven modules and samples
        run: |
          ./mvnw -B -ntp install -pl spring-boot-properties-migrator-maven-plugin -am
          ./samples/spring-boot-3.5-maven-sample/mvnw -B -ntp \
            -f samples/spring-boot-3.5-maven-sample/pom.xml \
            -Dmigrator.version="${{ steps.release-version.outputs.version }}" test
          ./samples/spring-boot-3.5-gradle-sample/gradlew \
            -p samples/spring-boot-3.5-gradle-sample test --no-daemon

      # The portal rejects re-uploading an existing version, which would abort the
      # release before Maven Central and the GitHub release are produced.
      - name: Check Gradle Plugin Portal for existing version
        id: portal
        run: |
          VERSION="${{ steps.release-version.outputs.version }}"
          URL="https://plugins.gradle.org/m2/com/patbaumgartner/spring-boot-properties-migrator-gradle-plugin/${VERSION}/spring-boot-properties-migrator-gradle-plugin-${VERSION}.pom"
          STATUS="$(curl -sSL -o /dev/null -w '%{http_code}' "$URL")"
          echo "Portal returned HTTP $STATUS for $URL"
          if [ "$STATUS" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Gradle plugin ${VERSION} is already on the portal; skipping publishPlugins."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Gradle plugin
        if: steps.portal.outputs.published != 'true'
        run: |
          ./spring-boot-properties-migrator-gradle-plugin/gradlew \
            -p spring-boot-properties-migrator-gradle-plugin \
            -PreleaseVersion=${{ steps.release-version.outputs.version }} \
            publishPlugins --no-daemon
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Stage Maven plugin for JReleaser
        run: |
          rm -rf spring-boot-properties-migrator-maven-plugin/target/staging-deploy
          ./mvnw -B -ntp -DskipTests deploy -pl spring-boot-properties-migrator-maven-plugin -am \
            -Drevision=${{ steps.release-version.outputs.version }} \
            -DaltDeploymentRepository=staging::file:${GITHUB_WORKSPACE}/spring-boot-properties-migrator-maven-plugin/target/staging-deploy

      - name: Prepare JReleaser config directory
        run: |
          mkdir -p "$HOME/.jreleaser"
          : > "$HOME/.jreleaser/config.properties"

      - name: Run JReleaser
        uses: jreleaser/release-action@90ac653bb9c79d11179e65d81499f3f34527dcd5 # 2.5.0
        env:
          # jreleaser.yml carries no version; the tag is the single source of truth.
          JRELEASER_PROJECT_VERSION: ${{ steps.release-version.outputs.version }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.JRELEASER_NEXUS2_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_PASSWORD: ${{ secrets.JRELEASER_NEXUS2_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
        with:
          version: 1.24.0
          setup-java: false
          arguments: full-release

      - name: Upload JReleaser logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jreleaser-logs
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
          retention-days: 7
          if-no-files-found: ignore
