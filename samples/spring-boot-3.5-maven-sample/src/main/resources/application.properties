# Deprecated in Spring Boot 3.5, safely renamed to server.max-http-request-header-size
server.max-http-header-size=16KB

# Deprecated in Spring Boot 3.5, but server.forward-headers-strategy is an enum while
# this property is a boolean, so the migrator reports it instead of breaking the value.
server.use-forward-headers=true

# Deprecated in Spring Boot 3.5, safely renamed to spring.http.codecs.max-in-memory-size
spring.codec.max-in-memory-size=1MB

# Not deprecated, just absent from Spring Boot's metadata: a typo of
# server.servlet.context-path. The deprecation scan cannot see it, so it is only
# reported when unknownKeys is switched on, and it is never rewritten or removed.
server.servlet.context-pathh=/demo
